<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratory Activity – Cryptography</title>
<link rel="stylesheet" href="crypto.css">
<script src="crypto.js" defer></script>
</head>

<body>
<div class="wrap">
<div class="card">
<h1>Cypher App</h1>
<label for="key">Please input any key.</label>
<input id="key" type="text" autocomplete="off">
<label for="input">Input Text</label>
<textarea id="input" placeholder="Type text to encrypt or decrypt..."></textarea>
<div class="row">
<button class="primary" id="enc">Encrypt</button>
<button class="primary" id="dec">Decrypt</button>
<button id="clear">Clear</button>
</div>
<div id="msg"></div>
<label for="output">Output Text (Encrypted / Decrypted)</label>
<textarea id="output" readonly placeholder="Result shows here..."></textarea>

</body>

</html>
